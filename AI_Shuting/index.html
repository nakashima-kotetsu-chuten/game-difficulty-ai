<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NEON BLASTER - Dynamic Difficulty Shooter</title>
    <meta name="description" content="AIがリアルタイムで難易度を調整する次世代シューティングゲーム。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div id="hud" class="glass">
            <div class="hud-item hp-container">
                <span class="label">HP</span>
                <div class="bar-bg"><div id="hpBar" class="bar-fill"></div></div>
            </div>
            <div class="hud-item score-container">
                <span class="label">SCORE</span>
                <span id="scoreValue" class="value">000000</span>
            </div>
            <div class="hud-item ai-status">
                <span class="label">AI DIRECTOR</span>
                <span id="aiMessage" class="value pulse">ANALYZING...</span>
            </div>
            <div class="hud-item difficulty-container">
                <span class="label">INTENSITY</span>
                <span id="difficultyValue" class="value">1.0x</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="overlay" class="overlay">
            <div class="overlay-content glass">
                <h1 class="neon-text">AI NEON BLASTER</h1>
                <p class="description">
                    AIがあなたのプレイを監視し、リアルタイムで難易度を最適化します。<br>
                    [W/A/S/D] 移動 | [SPACE] 攻撃
                </p>
                <div class="setup-info">
                    <p id="serverStatus" class="status-warning">Pythonサーバーを起動してください (python server.py)</p>
                </div>
                <button id="startBtn" class="premium-btn">SYSTEM INITIALIZE</button>
            </div>
        </div>

        <!-- Win/Loss Screen -->
        <div id="finalOverlay" class="overlay hidden">
            <div class="overlay-content glass">
                <h2 id="finalTitle" class="neon-text">MISSION END</h2>
                <div class="stats-grid">
                    <div class="stat-box"><span class="label">SCORE</span><span id="finalScore" class="value">0</span></div>
                    <div class="stat-box"><span class="label">ACCURACY</span><span id="finalAcc" class="value">0%</span></div>
                </div>
                <button id="restartBtn" class="premium-btn">RE-INITIALIZE</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
